[workspace]
resolver = "2"
members = ["crates/durable-agent", "crates/nade-gmail-sim", "crates/nade-server"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# P7: timezone-aware agent schedules. No crate uses it yet.
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[profile.dev]
# Tests dominate this repo's build time; keep them quick to iterate on.
opt-level = 0
debug = 1
